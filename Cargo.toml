[package]
name = "crest-synth"
version = "0.1.0"
edition = "2021"

[lib]
name = "crest_synth"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
cpal = "0.15"
triple_buffer = "9.0.0"
basedrop = "0.1"
symphonia = { version = "0.5", features = ["wav", "pcm"] }
gilrs = "0.10"
midly = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "0.3"
midir = "0.10"
eframe = "0.29"
egui = "0.29"
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
