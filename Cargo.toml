[package]
name = "crest-synth"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "crest-synth"
path = "src/bin/crest_synth.rs"

[[bin]]
name = "crest-synth-witness"
path = "src/bin/crest_synth_witness.rs"

# WP06 acceptance (crest-spec validation.webview_projection_shell): harness =
# false because the live-gated sections open a real Tauri window, which macOS
# permits only on the main thread; the default libtest harness runs every
# test on a worker thread. The target still runs under the declared
# `cargo test --test webview_projection_shell -- --nocapture` command.
[[test]]
name = "webview_projection_shell"
path = "tests/webview_projection_shell.rs"
harness = false

# WP05 T021 (mission webview-shell-cutover): the automated key-injection
# witness runs the real TauriWebviewWindow (debug seam page) and synthesizes
# NSEvents through the production local monitor, which macOS permits only on
# the main thread — harness = false for the same reason as above. Gated on
# window availability with a typed skip that fails under
# CREST_REQUIRE_KEY_WITNESS=1.
[[test]]
name = "input_capture_witness"
path = "tests/input_capture_witness.rs"
harness = false

[dependencies]
midly = "0.5.3"
cpal = "0.18.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rustysynth = "1.3.6"
rtrb = "0.3.4"
triple_buffer = "9.0.0"
anyhow = "1.0"
thiserror = "2.0"
# Webview shell runtime — the product's sole shell behind the AppWindow
# port (crest-spec selected_webview_stack; mission webview-shell-cutover).
# Default macOS bundle only — no tray, updater, or CLI features.
tauri = "2"

# Rust-side native key capture under a focused WKWebView (research R-02):
# the NSEvent local-monitor path lives in src/shell/webview/input_capture.rs.
# These are the same objc2 bindings tauri/wry already carry in the tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSApplication", "NSResponder", "NSWindow", "NSGraphicsContext", "block2"] }
objc2-foundation = "0.3"
block2 = "0.6"

[build-dependencies]
cc = "1.2"
tauri-build = "2"

[dev-dependencies]
sha2 = "0.10"
