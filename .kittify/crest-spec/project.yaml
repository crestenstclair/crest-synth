name: crest-synth
mission: crest-synth is a standalone controller-first instrument host. Its current executable slice prepares
  alternating capability-configured HiDef SoundFont and Braids instruments with capability-polymorphic
  voice policies and common per-note envelopes, processes up to three ordered descriptor-driven effect
  slots per Patch through one capability-described prepared effect rack drawn from a role-independent
  effect registry, routes Patch outputs through one fixed sixteen-track mixer whose indexed post-gate
  sends feed eight bounded bus returns drawn from the same registry before the master stage renders low-latency
  stereo audio, projects reducer-owned PATCH/MIXER focus, modes, return paths, valid actions, status,
  errors, and descriptor content through one immutable host-neutral semantic graphical view model inside
  the eframe/egui shell, edits canonical Patch, track, send, and return values, selects SoundFont presets
  by exact authored identity, and replaces structural instrument, effect-slot, and bus-return configuration
  through one off-callback prepared-graph workflow.
nonGoals:
  sequencing: crest-synth does not provide sequencing, transport, recording, arrangement, clips, patterns,
    a timeline, or song editing
  other_engines: production installs and permits prepared selection only between HiDef SoundFont and Braids;
    no additional oscillator, physical-model, standalone sampler, wavetable, FM, plugin, or layering is
    exposed
  additional_effects: crest-synth installs exactly three effect registry entries — Chorus, Reverb, and
    Delay — serving up to three ordered effect slots per Patch and eight bus returns; it does not provide
    any further effect type (no phaser, flanger, echo, tape delay, distortion, bitcrush, granular, convolution
    reverb, compressor, or EQ registry entry), no bypass or wet/dry duplicate control, and no slot or
    return count beyond the declared product ceiling; the deferred roster arrives later strictly as registry
    entries requiring no structural change
  elaborate_ui: crest-synth now provides the Phase 1 graphical shell, Phase 2 host-neutral semantic graphical
    contract, the corrective canonical sixteen-track routing/control slice, the Phase 4 component foundations
    — authored visual vocabulary, typeface, viewport density policies, reusable primitives, and the browsable
    gallery — the Phase 4 configurable control and shell composition families, and the authored mixer
    track column anatomy those compositions seat sixteen of; it does not yet provide the complete Phase
    5 Patch editor, the remainder of the component-polished Phase 6 Mixer composition — the Inspector,
    the eight indexed sends, and the bus-return surface — browser workflows, multi-select, or final Figma
    polish
  sound_library: crest-synth does not provide preset/session persistence, alternate SoundFont assets,
    a bank browser, sample-library management, or a patch browser; selecting a preset embedded in the
    fixed SoundFont is in scope
  live_midi_adapter: a physical MIDI device adapter is not included; the automatic file fixture implements
    the MIDI input port used by the application
  later_phase_three_increments: This increment does not introduce general PATCH Scalar editing, asset
    selection, an engine- or preset-choice modal, inactive-engine config caching, sibling-Patch navigation,
    or seamless voice/effect-tail migration
  later_roadmap_phases: The Phase 4 component foundations shipped — vocabulary, typeface, density policies,
    primitives, gallery, and the production repaint — followed by the Phase 4 configurable controls (parameter
    rows, choice rows, toggles, compact sliders, faders, meters, browser rows, modal options) and reusable
    compositions (application shell, context switch, identity header, section, Patch strip row, mixer
    strip bank, Utility/Inspector panel, footer) as shared components. The current increment redraws
    one mixer track column as its declared authored anatomy, presentation only. It does not introduce
    the complete Phase 5 Patch editor or the remaining component-polished Phase 6 Mixer surface, asset
    workflows, Modal or MultiSelect behavior, modulation, arbitrary graph editing, persistence, or final
    visual completion
meta:
  language: rust
  style: idiomatic Rust; explicit domain types; small modules; ports at external and real-time boundaries
  rules:
  - one resource owns each public type and consumers import that type
  - the standalone binary is a composition root; behavior lives behind domain and application abstractions
  - test support uses the same ports, reducer, parameter bridge, event ring, engine, mixer, and audio
    callback as the running application
  avoid:
  - engine-specific branches in Patch, reducer, projector, page projection, selection workflow, rack,
    renderer, or demo coverage; layering, unprepared structural replacement, or synthesis fallback
  - name-enumerated effect or routing identities; no type, variant, field, or descriptor entry in Synth,
    Mixer, RealTime, or Control is named after a concrete effect or bus (no MixerTrackParameter::ReverbSend,
    no BusId::Reverb), effects, slots, sends, and returns are addressed by index into descriptor-driven
    arrays, and master gain is the single declared exception
  - effect types beyond the three installed registry entries (Chorus, Reverb, Delay), bypass or wet/dry
    duplicate controls, more than three ordered slots per Patch, or more than eight bus returns
  - sequencer, transport, timeline, pattern, clip, or song-editing domain models
  - preset/session persistence or browsing, alternate SoundFont assets, modulation matrices, mixer-track
    insert chains, render-time graph assembly, arbitrary or unbounded buses, or plugin hosting; buses
    remain bounded and validated — eight returns is a ceiling, not an invitation to arbitrary graph editing
    — and the ordered Patch effect slots, eight bus returns, and embedded SoundFont preset selection are
    permitted
  - the complete Phase 5 Patch editor, the remaining component-polished Phase 6 Mixer surface, Modal
    or MultiSelect behavior before their owning workflows, asset browsers, final visual polish, or UI-owned
    domain/navigation/audio state; the Phase 1 shell, Phase 2 semantic model, corrective sixteen-track
    routing controls/meters, retained diagnostic content, the Phase 4 component foundations (vocabulary,
    typeface, density policies, primitives, gallery), the Phase 4 configurable control and shell composition
    families, and the authored mixer track column anatomy are permitted
  - a mixer track column assembled from whatever controls the projection reports for a track, a per-control
    caption repeating the track identity inside a column, a second full-height fader standing in for
    the compact pan readout, or a value presentation form spreading beyond the structure it is declared
    on
  - literal colors, type sizes, and spacing constants anywhere outside the declared visual vocabulary;
    a substituted or synthesized typeface; a surface branching on a raw viewport size instead of asking
    a declared density policy; or a component owning Patch, focus, navigation, reducer, or audio state
