context: Mixer
purpose: route post-effect Patch stems through one fixed bank of sixteen configurable tracks, then through
  a bounded bank of eight descriptor-driven bus returns
ubiquitousLanguage:
  MixerTrackId: one stable zero-based identity in the fixed T00 through T0F mixer bank
  BusId: one stable zero-based identity in the fixed bank of eight bus returns
  PatchOutput: one Patch-owned output-track choice plus pre-track trim
  MixerTrackParameters: the level, pan, mute, solo, and indexed send values owned by one mixer track
  BusSendLevel: one track-owned amount directed at one BusId, taken post-fader and post-gate
  BusReturn: one bounded destination holding zero or one registry effect and its own return level
valueObjects:
  MixerTrackId:
    description: the stable identity of one persistent mixer track
    from: u8
    invariants:
    - the value is in 0..=15 and displays as T00 through T0F without changing identity
    - the value is independent of PatchId, MIDI channel, Patch order, instrument schema, layout column,
      label, or widget id
    contributesTo:
      sixteen_track_mixer_routing: joins Patch routing, track state, semantic focus, fixed snapshots,
        meters, and proof through one bounded identity
      semantic_graphical_view_model: keeps MIXER focus stable across Patch and viewport changes
  PatchOutputParameter:
    description: one stable editable field owned by Patch output configuration
    from:
    - TrimGain
    - OutputTrack
    invariants:
    - TrimGain is continuous and OutputTrack is a nonwrapping stepped choice over all sixteen MixerTrackIds
    - the identity contains no display row, control index, label, or widget id
    contributesTo:
      sixteen_track_mixer_routing: gives PATCH Utility canonical trim and route controls
      schema_driven_patch_page: extends PATCH Utility without a second routing model
  PatchOutput:
    description: the complete Patch-owned scalar output configuration before fixed track accumulation
    state:
      trackId: MixerTrackId
      trimGainDb: f32
    invariants:
    - trackId is one of exactly sixteen prepared destinations and trimGainDb is finite in -60.0..=6.0
    - the value contains no track fader, pan, mute, solo, send, meter, scratch buffer, PatchId copy, or
      UI state
    - a production-owned descriptor supplies stable ids, labels, bounds, and fine/coarse or adjacent-choice
      behavior for both fields
    contributesTo:
      sixteen_track_mixer_routing: routes one post-effect Patch contribution without conflating the Patch
        with its destination track
      one_way_parameter_control: is edited only through semantic action, AppEvent, and AppState.apply
  BusId:
    description: the stable identity of one persistent bus return
    from: u8
    invariants:
    - the value is in 0..=7 and is rejected outside that range; it is never clamped, wrapped, defaulted,
      or substituted
    - the identity is positional and independent of whichever effect currently occupies the return, so
      changing a return's contents changes no BusId
    - no variant, constructor, or descriptor entry is named after a concrete effect
    contributesTo:
      expandable_effects_and_bus_topology: joins track sends, return contents, fixed snapshots, and proof
        through one bounded routing identity
      global_mix: replaces the two implicit shared-effect destinations with explicit addressable ones
  MixerTrackParameter:
    description: one stable configurable fader field owned by a mixer track
    from:
    - Level
    - Pan
    - Mute
    - Solo
    invariants:
    - MixerMain orders Level, Pan, Mute, and Solo; MixerInspector orders the eight sends by ascending BusId
      for the selected track
    - a send is addressed by the pair of MixerTrackId and BusId rather than by a named variant, so the
      identity does not grow when a return's contents change
    - the production-owned descriptor supplies kind, bounds, default, fine/coarse step, toggle behavior,
      label, and unit exactly once for every field; all eight sends share one send descriptor
    - the identity contains no PatchId, Patch parameter, row number, column number, label, or widget id
    contributesTo:
      sixteen_track_mixer_routing: defines the complete configurable surface for each of sixteen tracks
      expandable_effects_and_bus_topology: separates fader identity from routing address
      semantic_graphical_view_model: keeps row meaning stable while horizontal navigation changes tracks
  BusSendLevel:
    description: one track-owned amount directed at one bus return
    from: f32
    invariants:
    - the value is finite in 0.0..=1.0 and shares one production-owned descriptor across all eight sends
    - the value scales only its own track's contribution to its own destination
    contributesTo:
      expandable_effects_and_bus_topology: carries the send amount without naming its destination
  MixerTrackParameters:
    description: all canonical scalar and toggle state owned by one mixer track
    state:
      levelDb: f32
      pan: f32
      mute: bool
      solo: bool
      sends: '[BusSendLevel; 8]'
    invariants:
    - levelDb is finite in -60.0..=6.0 and pan is finite in -1.0..=1.0
    - sends is indexed by BusId and contains no field named after a concrete effect; adding a registry
      entry to a return changes no field of this value
    - mute and solo are explicit toggles; mute always wins and an active solo set excludes every non-soloed
      track from dry and send contribution
    - the value contains no Patch config, output route, meter, processor, buffer, UI state, or duplicate
      global parameter
    contributesTo:
      global_mix: configures one post-accumulation track before the bus returns and master
      sixteen_track_mixer_routing: is the canonical per-track state changed by the track controls
      expandable_effects_and_bus_topology: carries eight indexed sends at the cost of one field
  MixerState:
    description: the canonical fixed mixer bank owned inside AppState
    state:
      tracks: '[MixerTrackParameters; 16]'
    invariants:
    - all sixteen tracks exist before Patch installation and remain addressable whether zero, one, or
      many Patches route to them
    - array position is a bounded storage detail whose canonical semantic identity is the matching MixerTrackId
    - Patch installation, removal, schema replacement, or rerouting never creates, removes, reorders,
      or silently resets a track
    contributesTo:
      sixteen_track_mixer_routing: separates persistent mixer state from the Patch collection
      one_way_parameter_control: keeps every track edit in canonical reducer-owned state
  TrackMeter:
    description: one fixed-size numeric measurement of a post-level/pan track before its mute/solo gate
    state:
      leftPeak: f32
      rightPeak: f32
      rms: f32
    invariants:
    - all fields are finite and nonnegative and are zero for an empty or silent track
    - the meter remains active for a muted or solo-excluded sounding track and never controls audibility
    - the value is Copy, fixed-size, numeric, and contains no allocation, label, buffer, reference, UI
      state, or destructor
    contributesTo:
      sixteen_track_mixer_routing: makes every track's routed signal independently observable
      realtime_execution: keeps track metering bounded on the callback
  BusReturn:
    description: one bounded destination holding zero or one registry effect and its own output level
    state:
      id: BusId
      effect: Option<EffectConfig>
      returnLevel: f32
    invariants:
    - effect is drawn from the same EffectCapabilityRegistry that fills Patch effect slots; there is no
      role marker, send-suitability flag, or return-only registry
    - returnLevel is finite in 0.0..=1.0 and is owned by the return rather than declared as an effect
      descriptor scalar, so replacing the occupying effect neither resets nor loses it
    - an unoccupied return contributes silence and never passes its accumulated input through
    - a return sums into the dry mix and cannot feed any send, so no routing cycle is expressible
    contributesTo:
      expandable_effects_and_bus_topology: makes shared processing configurable through the ordinary effect
        contract instead of two fixed processors
      global_mix: carries the reverb and delay that were previously mixer-owned
  BusReturnBank:
    description: the canonical fixed return bank owned inside AppState
    state:
      returns: '[BusReturn; 8]'
    invariants:
    - all eight returns exist before Patch installation and remain addressable whether occupied or empty
    - array position is a bounded storage detail whose canonical semantic identity is the matching BusId
    - Patch installation, removal, schema replacement, or rerouting never creates, removes, reorders, or
      silently resets a return
    - the production composition initially occupies BusId 0 with effect.reverb and BusId 1 with effect.delay
      carrying the behavior of the retired mixer-owned global effects, while returns 2 through 7 begin
      unoccupied; this is default occupancy, not identity — every return changes contents through the
      same structural gesture
    contributesTo:
      expandable_effects_and_bus_topology: separates persistent routing destinations from what occupies them
  GlobalParameters:
    description: all editable parameters shared by the complete mix
    state:
      masterGainDb: f32
    invariants:
    - masterGainDb is in -60.0..=6.0 and is finite
    - master gain is the only genuinely global value; it is a property of the master stage rather than
      of any effect, and is the single documented exception to the no-name-enumeration invariant
    - the master stage comprises masterGainDb followed by one fixed safety stage that keeps every final
      stereo sample finite and within -1.0..=1.0, counting clipped samples in MixObservation instead of
      emitting non-finite or out-of-range output; the safety stage is a fixed master-stage element, never
      a registry effect, bypassable insert, or editable parameter
    - reverb and delay tuning values are descriptor scalars of their registry entries, and return levels
      are owned by their BusReturn; neither is duplicated here
    - a production-owned typed surface descriptor enumerates this field, its bounds, and its fine/coarse
      steps; AppState, StateProjector, and DemoScene consume the same descriptor
    - the descriptor contains each field exactly once before set conversion and is the independent pre-dispatch
      oracle for bounds and step sizes
    contributesTo:
      global_mix: configures the master level above the bus returns
      one_way_parameter_control: keeps global controls distinct from the sixteen track identities
  MixObservation:
    description: fixed-size callback-local measurements produced by MixEngine from its track, send, wet,
      and final-output buffers
    state:
      tracks: '[TrackMeter; 16]'
      leftPeak: f32
      rightPeak: f32
      outputRms: f32
      busInputRms: '[f32; 8]'
      busOutputRms: '[f32; 8]'
      nonFiniteSamples: u64
      clippedSamples: u64
    invariants:
    - the value is Copy, fixed-size, numeric, and created from exact callback buffers already owned by
      MixEngine without allocation, logging, formatting, locking, blocking, or I/O
    - tracks contains exactly one pre-gate meter in MixerTrackId order; busInputRms measures only post-gate
      track-send sums, indexed by BusId
    - busOutputRms measures each return's contribution before final master gain, indexed by BusId; an
      unoccupied return measures zero
    - peak and RMS fields are finite and nonnegative
    - the observation never feeds back into mixing decisions and is not a second owner of audio or parameter
      state
    contributesTo:
      sixteen_track_mixer_routing: provides exact per-track routing and mute/solo meter evidence
      live_observable_demo: provides causal send, wet, track, and output measurements from mixer-owned
        buffers
      realtime_execution: keeps callback measurements fixed-size and local before latest-value publication
ports: {}
# GlobalEffectsProcessor is retired. Its contract encoded both the number and the identity of returns in
# a signature — process(reverbInput, delayInput, output, parameters) — so no downstream generality could
# survive it. Bus returns now process through port.Synth.EffectPreparer and PreparedPostEffect, the same
# boundary that fills Patch effect slots, leaving exactly one prepared-effect contract in the system.
# Its two input obligations are preserved verbatim as PreparedBusReturnRack invariants in context.RealTime:
# wet excitation derives only from the declared return input, and zero input cannot create a wet return.
domainServices:
  MixEngine:
    purpose: trim and accumulate post-effect Patch stems into sixteen tracks, apply track controls and
      gates, feed indexed sends into the eight bounded bus returns, and produce the master mix
    uses:
    - MixerTrackId
    - BusId
    - PatchOutput
    - MixerTrackParameters
    - MixerState
    - BusReturn
    - BusReturnBank
    - TrackMeter
    - GlobalParameters
    - MixObservation
    - PatchAudioBlock
    - ParameterSnapshot
    - PreparedBusReturnRack
    meta:
      rules:
      - accept one independently rendered and already Patch-effect-processed stereo stem per active Patch,
        matched by PatchId and ParameterSnapshot index
      - clear sixteen preallocated stereo track buffers, apply only each Patch's trim, and accumulate
        that stem into exactly its validated output MixerTrackId; multiple Patches targeting one track
        sum before any track control
      - for each track apply its level and pan, measure one TrackMeter, then apply mute/solo audibility;
        mute always wins and when any solo is active only soloed non-muted tracks contribute
      - feed each of the eight bus inputs only from post-fader, post-gate track output scaled by that
        track's send for the matching BusId, then sum audible dry tracks and every occupied return and
        apply the master stage — masterGainDb followed by the fixed safety stage that bounds the final
        stereo output; the send stage does not move when the number of destinations changes
      - changing one track parameter changes every Patch contribution routed to that track and no contribution
        routed only to another track; changing one Patch route or trim changes only that Patch contribution
      - a route change is compatible fixed snapshot data because all sixteen destinations and scratch
        buffers are already prepared; an invalid route is rejected before publication and never clamped,
        wrapped, dropped, or substituted
      - MixEngine owns no Patch insert, effect slot, processor selection, or effect chain; it addresses
        eight bounded returns and never an arbitrary auxiliary bus, and it selects no concrete effect
      - an unoccupied return contributes silence; skipping its processing must not leave accumulated
        send input in the output buffer
      - all track, send, return, and output scratch buffers are fixed-capacity, indexed by BusId, and
        prepared before the audio callback
      - the mix operation returns one MixObservation measured from the sixteen track buffers, the eight
        bus inputs, the eight return outputs, and the final output; callers never inspect or borrow
        private buffers directly
    contributesTo:
      sixteen_track_mixer_routing: implements the fixed Patch-to-track-to-master signal path
      global_mix: implements track sends through the current shared effects and master
      static_patch_effect: consumes identity-preserving post-effect stems without owning or bypassing
        the upstream Patch processor
      realtime_execution: routes and mixes through preallocated callback-owned buffers
      live_observable_demo: measures the exact track and global stages needed by live checkpoints
