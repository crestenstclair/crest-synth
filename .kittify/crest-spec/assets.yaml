    prompts:
    - Create src/lib.rs and small snake_case modules grouped as kernel, synth, mixer, real_time, control,
      testing, and shell.
    - Each declared resource owns one public type or service. Re-export only the types required at context
      boundaries; do not create local duplicate models in adapters, tests, or the binary.
    - The testing module is part of the crate only to drive automatic MIDI input. It must not expose a
      sequencer or transport API.
  BehavioralWitnessMain:
    kind: rust-bin-target
    description: src/bin/crest_synth_witness.rs, a fast verification-only runner for isolated production-seam
      counterexamples
    profile:
      kind: verification_harness
      witness: typed production-seam mutation cases
      failurePolicy: emit one measured observation before returning the declared case exit status
    targets:
    - BehavioralMutationHarness
    - KeyboardInputTranslator
    - AppLoop
    - StateProjector
    - StateTree
    - LockFreeAudioBoundary
    - PreparedEngineRack
    - PreparedGraph
    - LockFreeStructuralGraphBoundary
    - ParameterSnapshot
    - AudioRenderer
    - MixEngine
    - PreparedBusReturnRack
    - ReverbPreparer
    - DelayPreparer
    prompts:
    - Create src/bin/crest_synth_witness.rs as a verification-only composition root over BehavioralMutationHarness;
      it is never called by the interactive crest-synth binary and exposes no product mode.
    - Accept exactly --case dropped-adjustment, cross-track-parameter-leak, patch-misroute, omitted-state-tree-leaf,
      dry-to-wet-bypass, or zero-renderer and exactly --mutant none or the matching case. Reject mismatched
      cases, duplicate options, and every other argument.
    - Run healthy and mutant cases through the same deterministic multi-Patch fixture and production services.
      Mutants are injected only at the named seam before observation; never append coverage, replace a
      measured field, edit a completed DemoSceneReport, or select a pre-authored result.
    - Print exactly one single-line CREST_MUTATION_OBSERVATION JSON object for both healthy and mutant
      executions. Healthy cases exit 0. Matching mutants print their actual measured counterexample and
      then exit 1 so witness.negativeExpectedExitCode is explicit and auditable.
    - 'Keep every case deterministic and fast: no physical audio device, native window, wall clock, random
      input, SoundFont file parse, MIDI file parse, network, or process spawning is part of this focused
      harness.'
    contributesTo:
      observable_demo_scene: provides six independently executable typed counterexamples for the behavioral
        gate
  BehavioralAcceptanceTests:
    kind: rust-integration-tests
    description: named integration-test targets whose absence cannot pass as a zero-test filter match
    profile:
      kind: verification_harness
      witness: compiled black-box acceptance targets
      failurePolicy: a missing target or unexecuted assertion fails cargo before evidence can pass
    targets:
    - CapabilityRegistry
    - EffectCapabilityRegistry
    - PostEffectConfig
    - SoundFontPresetId
    - SoundFontPresetCatalog
    - InstrumentCapabilityProvider
    - HiDefSoundFontAsset
    - HiDefSoundFontCapability
    - BraidsCapability
    - HiDefSoundFontPreparer
    - BraidsPreparer
    - ChorusCapability
    - ChorusPreparer
    - VoiceEnvelope
    - PreparedInstrument
    - InstrumentPreparer
    - PreparedEngineRackBuilder
    - PreparedEngineRack
    - PreparedPostEffectRack
    - PreparedGraph
    - StructuralGraphBoundary
    - LockFreeStructuralGraphBoundary
    - PreparedGraphBuilder
    - StructuralGraphCoordinator
    - Patch
    - ExhaustiveGuiDemo
    - LiveDemoRunner
    - BehavioralMutationHarness
    - EframeGraphicalWindow
    - TopLevelContext
    - SemanticAction
    - FocusPath
    - ReturnPath
    - SemanticGraphicalViewModel
    - InteractionState
    - AppEvent
    - PatchPageProjection
    - GraphicalShellProjection
    - TextProjection
    - WindowInput
    - KeyboardInputTranslator
    - AppState
    - AppLoop
    - EventLog
    - StateProjector
    - ParameterSnapshot
    - AudioBoundary
    - MixObservation
    - AudioObservationSnapshot
    - AudioObservation
    - AtomicAudioObservation
    - AudioRenderer
    - MixEngine
    - PreparedBusReturnRack
    - ReverbPreparer
    - DelayPreparer
    prompts:
    - 'Create seventeen explicit Cargo integration-test targets: tests/capability_schema.rs, tests/patch_page_projection.rs,
      tests/engine_selection_workflow.rs, tests/prepared_engine_rack.rs, tests/braids_engine.rs, tests/per_voice_envelope.rs,
      tests/soundfont_preset_selection.rs, tests/control_dispatch_performance.rs, tests/exhaustive_demo_scene.rs,
      tests/live_demo_scene.rs, tests/schema_surface.rs, tests/eframe_context.rs, tests/graphical_application_shell.rs,
      tests/semantic_graphical_view_model.rs, tests/sixteen_track_mixer_routing.rs, tests/expandable_effects_and_bus_topology.rs,
      and tests/behavioral_mutation_harness.rs. Project validations invoke them with cargo test --test,
      using --release for declared callback timing witnesses, so a missing target is a hard failure.'
    - Each target must call the public production seam it verifies. It may assemble deterministic fixtures,
      but it must not duplicate reducer, routing, state projection, GUI update, render, coverage, or mutation-verdict
      logic inside the test file.
    - capability_schema proves exact instrument/effect registries and generic Patch configs plus typed
      no-fallback rejection. patch_page_projection drives the production translator/AppLoop through PATCH
      Main and Utility, exact SoundFont/Braids/Chorus rows, canonical ADSR/effect edits, and exact PatchOutput
      trim/route controls while preserving MIXER focus. soundfont_preset_selection proves real-SF2 authored
      identity and correlated replacement. braids_engine proves pinned DSP, one sixteen-voice bank per
      Patch, scalar isolation, and callback safety. per_voice_envelope drives all four ADSR fields only
      through PATCH and proves exact fixed projections plus independent SoundFont/Braids note lifecycles.
      sixteen_track_mixer_routing proves all sixteen persistent tracks, shared-track accumulation, Patch
      trim/reroute isolation, all six track parameter classes, meters, stable focus, and callback safety.
      exhaustive_demo_scene and schema_surface include every PatchOutput, MixerTrackId, MixerTrackParameter,
      fixed track snapshot, meter, semantic path, and structural lifecycle with exact bidirectional coverage.
    - live_demo_scene uses a deterministic clock, frame-observation harness, production worker/structural
      ports, renderer, MixEngine, and AtomicAudioObservation to prove pacing and exact-generation causal
      audio. It routes Patch-owned controls through PATCH, all sixteen track controls through MIXER, two
      Patches through one track, and one Patch through a reroute; proves fixed meters, one adjacent SoundFont
      preset replacement, both engine directions, exact lifecycle/revision/effect preservation, rejection
      recovery, semantic all-notes-off, and inert completion without duplicating AppState.apply, routing,
      graph handoff, projection, render, coverage, or verdict logic.
    - control_dispatch_performance installs fifteen descriptor-configured Patches, sends 512 MIDI events
      through the production AppState, StateProjector, StateTree, EventLog, and ControlAudioBoundary path,
      requires completion within 50 ms in the unoptimized test profile, and relies on the projector unit
      equivalence proof that deferred snapshot/tree JSON equals eager canonical output.
    - prepared_engine_rack uses the production builders, HiDef preparer, generic rack, complete graph,
      structural boundary, coordinator, and renderer plus two distinct deterministic PreparedInstrument
      implementations to prove exact Patch targeting, isolated stems, block-boundary swap, graph-revision
      acknowledgement, one-in-flight throttling, queue-pressure retention, and destructor execution only
      during control collection; it must instrument the production callback path for zero allocation and
      destruction.
    - eframe_context drives real egui RawInput through EframeGraphicalApplication.update with its callback
      wired to AppLoop.dispatchAction, then proves the next frame and EventLog reflect the exact accepted
      value and semantic, shell, plus diagnostic projections; rendering a separately supplied projection
      is forbidden. graphical_application_shell renders both reference viewports through that same production
      update path and proves all five regions are visible, ordered, bounded, non-overlapping, and generation-coherent.
      semantic_graphical_view_model proves exact actions, stable paths, four surfaces, Navigate/Adjust,
      return, valid actions, status/errors, descriptor content, schema recovery, responsive invariance,
      and audio neutrality. behavioral_mutation_harness executes every healthy/mutant pair and asserts
      the measured predicate that each named seam falsifies.
    - 'Every target contains at least one ordinary #[test] function with concrete assertions and prints
      its exact CREST_ACCEPTANCE <target> passed marker only after all behavioral assertions succeed.
      Validations run with --nocapture and require that marker, so a target with zero executed tests cannot
      pass.'
