    prompts:
    - Create src/bin/crest_synth.rs as composition only. Parse HiDef.sf2 exactly once through HiDefSoundFontAsset,
      construct HiDefSoundFontCapability from its immutable catalog and HiDefSoundFontPreparer from that
      catalog plus its numeric prepared bank, then construct BraidsCapability/BraidsPreparer, ChorusCapability/ChorusPreparer,
      both prepared rack builders, ThreadedGraphPreparationWorker, and distinct audio, structural, and
      observation boundaries; inject all ports into StandaloneApplication, which validates and freezes
      the hydrated instrument/effect descriptors, and call run.
    - Fail startup for duplicate, missing, unknown, or mismatched instrument/effect capability or preparer
      registration. Install exactly instrument.soundfont.hidef, instrument.braids, and effect.chorus in
      production and never choose or substitute a fallback descriptor, config, asset, preset, provider,
      preparer, prepared instrument/effect, bypass, graph, or renderer.
    - Normal invocation expects ./sf2/HiDef.sf2, the vendored pinned Braids and Chorus DSP, and ./midi/Corridors
      of Time - Chrono Trigger.mid; resolves every fixture SoundFont identity to an exact catalog choice
      without fallback, configures one Chorus slot on the first Patch only, negotiates the physical device
      without starting it, builds the complete alternating instrument plus effect graph for that exact
      accepted configuration before starting the stream, and begins MIDI only after that succeeds. PATCH
      structural rows use the injected capacity-one preparation worker; there is no play command, transport,
      file chooser, preset browser/modal, engine-choice modal, effect selector, bypass, or alternate effect
      selection.
    - Support --smoke for headless deterministic execution, --observe to print one CREST_OBSERVATION JSON
      object, --demo-scene only with --smoke --observe to run the exhaustive current-GUI scene, --demo-live-graphical-shell
      by itself to retain the Phase 1 physical witness, --demo-live-semantic-view-model by itself to retain
      the Phase 2 semantic scene, --demo-live-sixteen-track-mixer-routing by itself to run the cumulative
      corrective routing scene, --demo-live as a compatibility alias of that newest routing scene, and
      verification-only --degenerate-audio or --degenerate-control only with --smoke --observe for behavioral
      falsification. Reject duplicate, mixed, or other options; every live spelling is mutually exclusive
      with every headless, observation, demo-scene, and degenerate flag.
    - When --demo-scene is present, print exactly one single-line CREST_EVENT_LOG JSON object, one single-line
      CREST_STATE_TREE JSON object, and one single-line CREST_OBSERVATION JSON object. Use stable Serialize
      data, never Debug output or Markdown; the ordinary interactive run emits no trace unless explicitly
      requested.
    - When --demo-live is present, pass StandaloneApplication.runLiveDemo control-side callbacks that
      print each returned checkpoint as CREST_LIVE_CHECKPOINT JSON, then print exactly one compact CREST_LIVE_EVENT_LOG_SUMMARY
      JSON with lossless counts and chain endpoints, CREST_LIVE_STATE_TREE JSON, CREST_LIVE_COVERAGE JSON,
      and CREST_LIVE_SUMMARY human-readable line from the completed report after note cleanup; retain
      the complete EventLog in LiveDemoReport verification and never dump every performance MIDI record
      or print/format from the runner or audio callback.
    - The live option uses the same HiDef.sf2, Braids/Chorus adapters, alternating Corridors of Time composition
      with first-Patch Chorus, AppLoop, EframeGraphicalWindow, CpalAudioOutput, prepared engine/effect
      racks, PreparedGraph, AudioRenderer, and mixer as normal interactive execution. It has no fake window,
      null device, offline-only renderer, silent fallback/bypass, direct state edit, or alternate demo
      reducer.
    - After the graphical-shell live scene completes and teardown is observed on control ownership, print
      exactly one CREST_GRAPHICAL_SHELL_LIVE_OBSERVATION JSON object containing the declared region, PATCH/MIXER,
      physical-audio, note-cleanup, window-close, stream-release, and graph-collection fields; never infer
      those fields from labels or print them from the callback. The enclosing witness command's actual
      zero exit proves normal parent-process completion separately.
    - After the semantic-view-model live scene completes and teardown is observed on control ownership,
      print exactly one CREST_SEMANTIC_VIEW_MODEL_LIVE_OBSERVATION JSON object containing measured context/surface/mode/return/action/status/healthy-error/focus-recovery/responsive,
      physical-audio, cleanup, close, stream, and graph fields; never infer those fields from labels or
      print them from the callback.
    - After the sixteen-track routing live scene completes and teardown is observed on control ownership,
      print exactly one CREST_SIXTEEN_TRACK_MIXER_ROUTING_LIVE_OBSERVATION JSON object containing measured
      fixed-track, shared-route, trim/reroute, track-control, meter, snapshot, physical-audio, cleanup,
      close, stream, and graph fields; never infer those fields from labels or print them from the callback.
    - After frozen scalar coverage, --demo-live selects one adjacent preset on the focused first SoundFont
      Patch, then SoundFont to Braids and back to descriptor-default SoundFont through semantic AppEvents
      and ThreadedGraphPreparationWorker; wait nonblockingly for every Preparing, Activating, Ready sequence
      and newer acknowledged graph revision, dispatch targeted MIDI, and require finite nonzero target
      output before advancing or reporting completion.
    - Before --demo-live device startup, print one concise status explaining that the run is autonomous,
      input-isolated, and bounded. If the runner makes no semantic/checkpoint/lifecycle/cleanup progress
      for ten seconds or exceeds 120 seconds total, retain a typed stage-specific error, close the window,
      clean up notes, release the stream, shut down structural ownership off callback, and exit nonzero
      without a report.
    - During --demo-live, ignore mapped semantic window input so it cannot interleave an AppState generation
      with the autonomous checkpoint protocol; native window close remains available as typed incomplete-demo
      cancellation and normal interactive mode keeps its existing keyboard dispatch.
    - After live completion emit the four final records synchronously, return false from the same window
      tick to send a viewport-close command, release the physical stream after the window returns, and
      exit successfully when no runtime error was retained.
    - The smoke path loads the real fixed SoundFont, pinned Braids and Chorus adapters, and MIDI fixture,
      installs alternating instrument Patches with one first-Patch Chorus, applies keyboard-equivalent
      navigation and adjustment events, renders bounded synthesis-to-effect-to-mix audio blocks, and reports
      measurements from the production services.
    - The observation must exercise at least two simultaneously sounding Patches, edit a Patch whose id
      is greater than 1, compare the edited and unedited Patch stems separately, and prove the unedited
      stem is sample-identical while the edited stem changes.
    - The observation must also drive the selected parameter to a boundary, send one more adjustment toward
      that boundary, then prove a later valid edit is accepted without restarting the application.
    - The demo-scene observation delegates to ExhaustiveGuiDemo, includes its coverage summary in CREST_OBSERVATION,
      and returns a failure when the event journal drops a record, the final state tree disagrees, or
      any expected current event/property/parameter/effect identifier is missing.
    - The demo scene uses DeterministicGraphPreparationWorker through the production port, selects one
      adjacent authored SoundFont preset and then the first Patch SoundFont to Braids to descriptor-default
      SoundFont, proves pending/busy/activation/retirement and audible target output for each structural
      edit, then injects one controlled preparation failure plus stale/mismatched outcomes without editing
      the report.
    - 'Degenerate modes mutate the real seam before observation: --degenerate-control drops exactly one
      selected Adjust before AppLoop dispatch and --degenerate-audio clears the caller-owned buffer immediately
      after AudioRenderer.render. They never append a fake missing identifier, suppress peak accumulation,
      or overwrite an observation field. Demo-scene mutants emit the complete schema-valid trace and observation
      first, then exit 1 when detected; smoke mutants emit their schema-valid falsifying observation and
      exit 0 as declared by their legacy witnesses.'
