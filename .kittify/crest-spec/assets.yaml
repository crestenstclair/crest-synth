      pair resolves to exactly one declared ComponentControl, that every declared control is reachable
      by at least one pair, and that the mapping is exhaustive rather than defaulted. A test that only
      proves the controls exist is vacuous; drive them through the production render path with real projected
      view data.
    - Prove each control renders every state it declares applicable with text or shape beyond color, and
      that a state it declares non-applicable is declared rather than merely absent.
    - Prove every region the production window shows is produced by a declared ShellComposition and every
      control within one by a declared ComponentControl, and that the render adapter holds no paint, layout,
      band-height, or state-visualization decision. Prove the guard fails when one is reintroduced.
    - Prove that a composition handed a projection slice with no data for part of its designed structure
      omits it or marks it explicitly unavailable, and never paints a value that was not in the view data.
    - Prove no control or composition owns, caches, or derives Patch values, focus, navigation, reducer
      state, or audio state, and that none dispatches a SemanticAction.
    - Prove both authored viewports still retain every structural band, the persistent side region, and
      the authored minimum interactive target after recomposition, with no clipped or overlapping text.
    contributesTo:
      component_vocabulary: is the deterministic proof that the controls and compositions exist and that
        the shipped shell actually uses them
      graphical_application_shell: proves the recomposition preserved the shell's structure and passivity
