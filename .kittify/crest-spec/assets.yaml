      soundfont_preset_selection: parses the fixed asset once, wires its catalog and numeric bank to the
        provider/preparer pair, and hosts live preset-selection proof without owning behavior
      soundfont_audio: starts the concrete SoundFont synth
      braids_engine: starts the pinned concrete Braids synth
      per_voice_envelope: composes the canonical ADSR into both prepared engines
      static_patch_effect: composes the one installed Chorus provider/preparer and first-Patch config
