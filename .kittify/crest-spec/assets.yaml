assetKinds:
  cargo-manifest:
    description: Cargo.toml
    filePattern: Cargo.toml
  makefile:
    description: GNU Makefile exposing stable human entry points
    filePattern: Makefile
  rust-library-root:
    description: Rust library root
    filePattern: src/lib.rs
  rust-bin-target:
    description: Rust executable composition root
    filePattern: src/bin/*.rs
  rust-integration-tests:
    description: Named Cargo integration-test targets
    filePattern: tests/*.rs
  rust-context-source:
    description: Rust source modules of one bounded context or the adapter layer under src/
    filePattern: src/*/*
  validation-script:
    description: Deterministic guard scripts invoked by declared validations
    filePattern: scripts/*
  product-design-authority:
    description: The master product design document — authority for what the product should be
    filePattern: DESIGN.md
  delivery-roadmap:
    description: The phase roadmap and its corrective gates
    filePattern: ROADMAP.md
  vendored-typeface:
    description: The vendored authored typeface, its license, provenance, and hash manifest
    filePattern: vendor/azeret-mono/*
assets:
  KernelContextModules:
    kind: rust-context-source
    description: src/kernel — shared identity and value primitives realizing context.Kernel resources
  SynthContextModules:
    kind: rust-context-source
    description: src/synth — Patch aggregate, effect registry, descriptors, slots, and engine/effect preparation
      realizing context.Synth resources
  MixerContextModules:
    kind: rust-context-source
    description: src/mixer — sixteen-track bank, bus identities, sends, returns, and mix engine realizing
      context.Mixer resources
  RealTimeContextModules:
    kind: rust-context-source
    description: src/real_time — bounded snapshot transport, prepared graphs and racks, structural coordination,
      and renderer realizing context.RealTime resources
  ControlContextModules:
    kind: rust-context-source
    description: src/control — reducer, semantic actions and focus, and view projections realizing context.Control
      resources
  ShellContextModules:
    kind: rust-context-source
    description: src/shell — egui rendering of projected state realizing context.Shell resources, including
      the authored visual vocabulary, typeface installation, density policies, reusable primitives, the
      configurable control family, and the shell compositions every surface paints through
    targets:
    - SemanticVisualToken
    - AuthoredTypeface
    - ViewportDensityPolicy
    - ComponentState
    - ComponentControl
    - ShellComposition
    - WindowInput
    prompts:
    - Declare the authored vocabulary once. Colors, type styles, spacing steps, and geometry are named
      by their canonical authored names and carry the authored values exactly; raw values stay private
      to this module and are reachable only through the named token.
    - Install the vendored typeface into the rendering context once before the first painted frame, binding
      each authored weight to the type styles that declare it. An unavailable face returns a typed error
      the shell makes visible; never substitute or synthesize a face.
    - Express both authored viewports as declared density policies carrying bands, split, inset, row height,
      row pitch, and control geometry. Surfaces ask the policy; no surface branches on a raw viewport
      size, and no third hard-coded layout is introduced.
    - Provide the primitives — text roles, hairlines, keylines, focus frames, value displays, status marks,
      and action hints — as functions over immutable view data plus an explicit ComponentState. A primitive
      paints; it never owns Patch values, focus, navigation, reducer state, or audio state, and never
      reaches AppState.
    - Match ComponentState exhaustively at every rendering site so an added state fails compilation rather
      than defaulting silently, and render every state with text or shape in addition to color.
    - Repaint the existing eframe adapter through the vocabulary and delete the constants it previously
      painted from. The production application, not only the gallery, must show the authored design.
    - Provide one control per declared ComponentControl variant. Selection is total over SemanticControlKind
      and presentation role together — the same continuous parameter is a parameter row on a listed surface
      and a fader in a mixer strip — and every declared control is reachable by at least one pair. A control
      takes an immutable SemanticControlViewModel, an explicit ComponentState, and the role its caller
      asks in, and returns typed semantic intent; it dispatches nothing, owns nothing, and reaches AppState
      never.
    - The requesting composition supplies the presentation role. A control never infers it from the value,
      the surface identity, or the viewport.
    - Declare per control which ComponentStates apply to it. Non-applicability is declared, not silently
      omitted, so the coverage assertion checks declared applicability rather than the full cross product.
    - Take each control's geometry, spacing, and state treatment from the visual design reference the
      way the tokens were taken, not from what the shell happens to render today. This is the phase where
      visual fidelity begins to matter.
    - Provide one composition per declared ShellComposition variant. A composition arranges primitives
      and controls, resolves bands, split, inset, row height, and row pitch from ViewportDensityPolicy,
      and declares no color, type style, spacing step, or geometry value of its own.
    - Where a composition's designed structure has no view data behind it, omit that structure or mark
      it explicitly unavailable. Never paint an invented or representative value in the production shell;
      representative content belongs to the gallery.
    - Add no SemanticAction variant, no focus target, and no reducer behavior. This changes how state
      is rendered, never what state exists; the existing shell, projection, and focus verification must
      pass unchanged.
    contributesTo:
      component_vocabulary: owns the vocabulary, typeface, policies, primitives, controls, and compositions
        every surface resolves through
      graphical_application_shell: replaces adapter-owned visual constants and adapter-local region painting
        without changing the shell's structural bands or passivity
      semantic_graphical_view_model: renders the projected control view model without introducing a second
        model of it
  TestingContextModules:
    kind: rust-context-source
    description: src/testing — retained scenes, deterministic workers, mutation harness, and measurements
      realizing context.Testing resources, including the browsable component gallery scene
    targets:
    - ComponentGalleryPage
    - ComponentGalleryObservation
    - ComponentState
    - ComponentControl
    - ShellComposition
    - ViewportDensityPolicy
    prompts:
    - Add the browsable component gallery scene. It renders the declared pages through the shared primitives
      and vocabulary, binds one digit key per page locally, and shows the active page identity on screen.
    - Page selection is scene-local. It never becomes a SemanticAction, never reaches AppState, and never
      changes focus, Patch values, graph revision, or audio behavior. A digit with no page bound retains
      the current page.
    - Render every declared ComponentState with representative content at both authored viewports, and
      assert coverage from the closed page and state sets so a missing specimen or an unbound page fails
      rather than being silently omitted.
    - This scene is browsable by design and therefore makes no exact-generation claim. Do not give it
      the autonomous witness contract, and do not weaken that contract in the scenes that hold it.
    - Emit the gallery observation only after painting, copying the page, state, and viewport identity
      actually rendered. A pre-render plan or a constructed specimen list must not be able to satisfy it.
    - Add the control and composition pages. Every declared ComponentControl appears in every state it
      declares applicable, and every declared ShellComposition appears filled with representative content,
      both at the desktop and Steam Deck viewports.
    - The declared page count now exceeds the available digits. Keep the ten digit bindings in declared
      order — the eight that existed before keep exactly the pages they had — and add bidirectional stepping
      over the full order so no page is reachable by neither route. Stepping does not wrap past an end.
    - Construct no audio output and no MIDI event source. Report that as a measured field in the emitted
      observation so the gallery's silence is falsifiable rather than claimed.
    contributesTo:
      component_vocabulary: makes every declared value, state, control, and composition visually judgable
        and measurably covered
  AdapterModules:
    kind: rust-context-source
    description: src/adapter — thin capability, preparer, device, window, and asset adapters implementing
      the declared ports
    targets:
    - AppWindow
    - ShellComposition
    - ComponentControl
    prompts:
    - Reduce the eframe window adapter to window plumbing and event translation. Every region it shows
      is painted by a declared ShellComposition and every control within one by a declared ComponentControl;
      the adapter decides no paint, layout, band height, or state visualization.
    - Move the region and control painting the adapter currently owns into the shell's composition and
      control modules rather than deleting it. The adapter's remaining size is the measure of whether
      that move actually happened.
    - Keep the window passive and the observation contract intact. It still emits one immutable ShellFrameObservation
      after painting and still stores no canonical state.
    contributesTo:
      component_vocabulary: proves the composition family by leaving the adapter with nothing visual to
        decide
      graphical_application_shell: keeps the production window boundary while removing its visual authority
  CargoManifest:
    kind: cargo-manifest
    description: Cargo.toml and build.rs for the capability-configured standalone synth with Rust SoundFont
      plus pinned C++ Braids and Chorus renderers
    profile:
      kind: configuration
      ecosystem: cargo
    targets:
    - HiDefSoundFontAsset
    - HiDefSoundFontCapability
    - HiDefSoundFontPreparer
    - BraidsCapability
    - BraidsPreparer
    - ChorusCapability
    - ChorusPreparer
    - ChorusSourceBundle
    - ReverbCapability
    - ReverbPreparer
    - DelayCapability
    - DelayPreparer
    - LockFreeAudioBoundary
    - LockFreeStructuralGraphBoundary
    - ThreadedGraphPreparationWorker
    - DeterministicGraphPreparationWorker
    - AtomicAudioObservation
    - CorridorsMidiEventSource
    - EframeGraphicalWindow
    - CpalAudioOutput
    - AudioDeviceConfig
    - AudioDeviceRuntimeError
    - BehavioralWitnessMain
    prompts:
    - Create Cargo.toml for one Rust library, the crest-synth product binary, and the crest-synth-witness
      verification-only binary.
    - 'Use only dependencies required by the declared resources: rustysynth, midly, cpal, matching eframe/egui
      and egui_extras, rtrb, triple_buffer, serde with derive, serde_json, thiserror, anyhow, and the
      build-only cc crate for the fixed audited Braids and Chorus C++ source lists. Enable only the egui_extras
      layout and image/SVG loader features used by the shell. Complete graph destruction uses the dedicated
      ownership-return structural queue and no deferred-drop dependency. Development-only test helpers
      may be added when required by the declared tests.'
    - Do not add another synthesis/effect framework, GUI runtime, component library, sequencing, persistence,
      plugin, database, networking, or async-runtime library; the pinned vendored native subsets are built
      only through the declared opaque adapters.
  BuildMakefile:
    kind: makefile
    description: 'Makefile: stable human entry points for building, checking, running, and observing the
      synth'
    profile:
      kind: configuration
      ecosystem: make
    targets:
    - CargoManifest
    - LibraryRoot
    - CrestSynthMain
    - LiveDemoRunner
    prompts:
    - 'Create the project-root Makefile. The default target is help, which lists every public target and
      its one-line ## description.'
    - 'Provide these Cargo-backed targets: build (cargo build), check (cargo check --all-targets), test
      (cargo test --all-targets), lint (cargo clippy --all-targets -- -D warnings), fmt (cargo fmt --all),
      fmt-check (cargo fmt --all -- --check), run (cargo run --bin crest-synth), smoke (cargo run --bin
      crest-synth -- --smoke), observe (cargo run --bin crest-synth -- --smoke --observe), demo (cargo
      run --bin crest-synth -- --smoke --observe --demo-scene), demo-live-graphical-shell (cargo run --release
      --bin crest-synth -- --demo-live-graphical-shell), demo-live-semantic-view-model (cargo run --release
      --bin crest-synth -- --demo-live-semantic-view-model), demo-live-sixteen-track-mixer-routing (cargo
      run --release --bin crest-synth -- --demo-live-sixteen-track-mixer-routing), demo-live as an alias
      of the newest sixteen-track routing scene, and clean (cargo clean).'
    - Provide play and ui as documented aliases for run because normal startup automatically plays the
      fixed MIDI fixture in the graphical window.
    - 'Provide demo-live-component-library (cargo run --release --bin crest-synth --
      --demo-live-component-library). Unlike every other demo-live target it is browsable rather than
      autonomous: it opens the gallery, accepts digit keys to change page, and exits when the operator
      closes the window. It makes no exact-generation claim and is not an alias target for demo-live.'
    - Keep demo exactly headless and deterministic. Retain demo-live-graphical-shell as the Phase 1 witness
      and demo-live-semantic-view-model as the Phase 2 witness. demo-live-sixteen-track-mixer-routing
      cumulatively opens the real graphical window and physical audio device, displays all sixteen tracks,
      proves shared-track routing, Patch trim/reroute, track controls and meters, retains the semantic/scalar/preset/engine
      proof, then emits final evidence once, closes, releases the stream, and returns success. demo-live
      points to this newest cumulative scene.
    - Use portable Make syntax and declare non-file targets phony. Do not reference removed proof binaries,
      alternate MIDI files, afplay, or obsolete synth_ui commands.
  ChorusSourceBundle:
    kind: source
    path: vendor/chorus
    layer: infrastructure
    targets:
    - ChorusPreparer
    meta:
      rules:
      - vendor only the Chorus, FxEngine, exact required resource table/header, stmlib subset, license,
        and provenance files required by the opaque wrapper
      - record upstream URLs, exact eurorack and stmlib revisions, license notices, and a SHA-256 manifest
        for every vendored source
      - retain the upstream notices but expose the product label only as Chorus; do not use Mutable Instruments
        or Rings as Crest product branding
    contributesTo:
      static_patch_effect: makes native source and license provenance reproducible
  EngineSelectionAcceptanceTests:
    kind: rust-integration-tests
    description: tests/engine_selection_workflow.rs, the non-vacuous production-path acceptance for asynchronous
      Patch engine replacement
    profile:
      kind: verification_harness
      witness: two-direction structural engine selection
      failurePolicy: missing target, missing marker, fallback, silence, lifecycle mismatch, or callback
        ownership violation fails
    targets:
    - DescriptorDefaultConfigFactory
    - AppState
    - AppLoop
    - DeterministicGraphPreparationWorker
    - StructuralGraphCoordinator
    - AudioRenderer
    - ExhaustiveGuiDemo
    - EngineSelectionObservation
    prompts:
    - Create tests/engine_selection_workflow.rs with at least one ordinary assertion-bearing test and
      emit CREST_ACCEPTANCE engine_selection_workflow passed only after the structured observation satisfies
      every witness predicate.
    - Use the production HiDef and Braids providers/preparers, reducer/projector/AppLoop, deterministic
      implementation of the production worker port, complete graph builder, structural boundary/coordinator,
      renderer, and audio observation. Do not duplicate lifecycle, preparation, routing, render, or verdict
      logic in the test.
    - Prove SoundFont to Braids to descriptor-default SoundFont, old-engine audio while pending, a busy
      rejection, a controlled preparation failure, stale and mismatched outcomes, target-only mutation,
      compatible committed snapshots, block-boundary swaps, control-side retirement, finite nonzero targeted
      output, zero callback allocation/destruction, no fallback, and two-run logical determinism.
    - The exhaustive make demo must execute the same lifecycle and failure path; this focused target does
      not replace demo coverage.
    contributesTo:
      asynchronous_engine_selection: provides the focused executable lifecycle witness
      observable_demo_scene: keeps the focused target and exhaustive demo on the same production seams
  GraphicalShellAcceptanceTests:
    kind: rust-integration-tests
    description: tests/graphical_application_shell.rs, the non-vacuous headless egui contract for Phase
      1 shell structure and responsive composition
    profile:
      kind: verification_harness
      witness: desktop and Steam Deck graphical shell
      failurePolicy: missing region, overlap, stale projection, UI-owned state, missing marker, or vacuous
        test fails
    targets:
    - GraphicalShellProjection
    - ShellFrameObservation
    - StateProjector
    - AppLoop
    - EframeGraphicalWindow
    prompts:
    - Create tests/graphical_application_shell.rs with ordinary assertions and emit CREST_ACCEPTANCE graphical_application_shell
      passed only after every structural and projection assertion succeeds.
    - Drive real egui RawInput through the production update callback at 1920x1080 and 1280x800; inspect
      tessellated output and recorded region rectangles for exact context line, header, workspace, side
      region, and footer identity, visibility, ordering, bounds, and non-overlap.
    - Switch PATCH and MIXER through KeyboardInputTranslator, SemanticAction, and AppLoop, prove the frame,
      SemanticGraphicalViewModel, GraphicalShellProjection, retained TextProjection, StateTree, EventRecord,
      ParameterSnapshot generation, and unchanged graph/audio values agree, and reject any adapter-owned
      context, focus, mode, or return state.
    - Keep the test headless and deterministic; physical audio and full lifecycle proof remain the separate
      make demo-live-graphical-shell witness.
    contributesTo:
      graphical_application_shell: provides the focused deterministic shell and responsive-layout witness
  LibraryRoot:
