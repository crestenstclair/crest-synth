      and two identity accents the reference does not publish as variables; the union of both is authoritative
      and neither source is silently trimmed to match the other.
    - Record that the Steam Deck density policy is authored from the desktop frames rather than measured
      from an authored small-viewport design, and that loading and error appearances reuse the structural-edit
      vocabulary this document already declares rather than inventing a second visual language.
    - Keep its vocabulary in agreement with the declared model — bus returns are named as returns, effect
      positions as ordered slots — and carry no retired term for a routing destination or effect.
    - When product intent here and the crest-spec disagree, resolve it during crest-spec authoring rather
