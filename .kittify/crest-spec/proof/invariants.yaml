invariantGroups:
- group: core
  invariants:
  - text: AppState.apply is the only control-state mutation path
    meta:
      rationale: every input follows one reducer path
  - text: input and view adapters emit AppEvents and never mutate application or engine state
    meta:
      rationale: adapters remain replaceable
  - text: PATCH and MIXER are the only top-level contexts; InteractionState owns context and stable PATCH
      focus resolved as Engine, canonical ADSR, instrument StructuralChoice controls, then ordered effect
      ScalarEdit controls, while the graphical window renders only immutable GraphicalShellProjection
      data and the retained TextProjection remains diagnostic
    meta:
      rationale: page selection remains semantic, deterministic, capability-driven, and independent from
        UI state
  - text: after an event is accepted, the application commits AppState before deriving serialized state,
      text, parameter snapshots, or audio commands
    meta:
      rationale: effects always describe accepted state
  - text: engine and structural parameter selection share one app-wide, one-in-flight reducer-owned lifecycle;
      a capacity-one worker prepares off callback, PreparedGraph stays outside AppState, only the intended
      config assignment commits before target-revision projection/publication, and Ready requires block-boundary
      activation plus off-callback retirement collection
    meta:
      rationale: structural edits preserve one-way mutation and hard-real-time ownership
  - text: the audio callback never allocates, locks, blocks, performs file or device discovery I/O, logs,
      or destroys owned state
    meta:
      rationale: the callback has a hard deadline
  - text: AudioBoundary carries discrete MIDI commands and latest scalar values, while StructuralGraphBoundary
      uses distinct bounded queues for prepared and retired graph ownership plus fixed-size acknowledgement
    meta:
      rationale: each real-time datum uses its required delivery semantics
  - text: Patch and instrument config are capability-polymorphic and PreparedEngineRack hosts exactly
      the HiDef SoundFont and pinned Braids preparers; one SoundFont parse yields a string-bearing control
      catalog and separate numeric callback bank, SoundFont uses one EngineManaged synthesizer per Patch,
      every Braids Patch owns FixedPerPatch(16), both use the common per-note envelope, and unknown capabilities
      or presets fail without fallback
    meta:
      rationale: two materially different voice policies and one metadata-safe structural choice let the
        Patch page prove schema projection without engine branches
  - text: Patch-local processing is up to three ordered descriptor-driven effect slots per Patch, applied
      in ascending slot index order between synthesis and MixEngine; shared processing is eight bounded
      bus returns fed by indexed post-gate track sends; both roles draw from one role-independent effect
      registry whose current installed entries are exactly Chorus, Reverb, and Delay, and the mixer owns
      no effect processor of its own
    meta:
      rationale: capacity and generality grow to the declared product ceiling while the effect-type roster
        stays deferred
  - text: 'no name-enumerated effect or routing identity: no type in Synth, Mixer, RealTime, or Control
      may enumerate a variant, field, or descriptor entry named after a specific effect or bus; effects,
      slots, sends, and returns are addressed by index into descriptor-driven arrays, and adding a registry
      entry must require no change to any of these types. The single exception is MasterGainDb: master
      gain is genuinely global, a property of the master stage rather than of any effect'
    meta:
      rationale: the closed enumerated design shipped despite DESIGN.md declaring the expansion in advance,
        so a prose constraint is a demonstrably insufficient control here; the executable check is validation.no_name_enumerated_identity,
        a static source-tree check over the four named contexts seeded with the retired concrete identifiers
  - text: the Start control remains reserved for the deferred Phase 7 sample-preview hold gesture; no
      current phase binds Start to any WindowInput, SemanticAction, or reducer behavior
    meta:
      rationale: DESIGN.md reserves Start elsewhere now, in Phases 1-6, so the input vocabulary must not
        consume it before the Sample Browser workflow owns it
  - text: AppState owns exactly sixteen persistent MixerTracks; each Patch owns only one validated output
      track and trim, MixEngine sums post-effect Patch stems into fixed track scratch before applying
      track level/pan/mute/solo/sends, and meters observe tracks before the audibility gate
    meta:
      rationale: Patch identity and mixer-channel identity are distinct product concepts
  - text: the MIDI-file module is an automatic test input adapter, not a sequencer or product transport
    meta:
      rationale: crest-synth remains an instrument
  - text: every rendered color, type style, spacing step, and geometry value resolves through
      SemanticVisualToken and equals its authored value exactly; no adapter, view, scene, or test outside
      that resource constructs a literal color, type size, or spacing constant
    meta:
      rationale: one authored source is what makes later screens composable instead of repainted
  - text: the authored typeface is registered once before the first painted frame and every declared type
      style resolves to it; an unavailable face is a typed visible failure and never a substituted or
      synthesized fallback
    meta:
      rationale: a substituted face would let the product claim the authored design while not rendering it
  - text: both authored viewports resolve through a declared ViewportDensityPolicy retaining every
      structural band, the persistent side region, and the authored minimum interactive target; no surface
      branches on a raw viewport size and no third hard-coded layout exists
    meta:
      rationale: resolution-specific constants scattered across surfaces is the failure this phase removes
  - text: ComponentState is closed and exhaustively matched at every rendering site, and every state renders
      with text or shape in addition to color
    meta:
      rationale: closed unions name every site that must change, and color alone is not an accessible signal
  - text: components accept immutable view data plus explicit state and render from them alone; no component
      owns or caches Patch values, focus, navigation, reducer state, or audio state, and none converts an
      input into a semantic action
    meta:
      rationale: the one-way state path survives only if the component layer stays passive; the webview
        cutover retired the Rust-side typed-intent return, so passivity is held by this boundary rather
        than by the shape of a returned value
  - text: one mixer track column is the closed, exhaustively matched MixerTrackColumnStructure anatomy
      — track header, level fader, level readout, pan readout, state line — in that order at proportions
      resolved from ViewportDensityPolicy, with the track header its only name and MidiHexadecimal bound
      to its level readout alone; the column changes presentation only and adds no SemanticAction variant,
      focus target, reducer behavior, or projection field
    meta:
      rationale: a column assembled from whatever controls the projection reported divides available height
        instead of expressing a designed shape, which is why the mixer read as a spreadsheet; declaring
        the anatomy as a closed union names every site an added structure must change
  - text: component gallery page selection is scene-local and never becomes a SemanticAction, reaches
      AppState, or changes focus, Patch values, graph revision, or audio behavior; the browsable gallery
      makes no exact-generation claim and does not weaken the autonomous witness contract
    meta:
      rationale: a browsable scene and an autonomous witness have opposite input contracts and must not
        be conflated in either direction
