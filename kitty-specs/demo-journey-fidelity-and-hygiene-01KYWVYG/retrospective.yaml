  details: >-
    WP09 (branched from WP08) called Patch::with_post_effects, which WP05
    deleted in a sibling lane. Both lanes reviewed clean because neither
    reviewer could observe the other. Only compiling the integrated tree
    surfaced it. See n-006 for the structural cause.
