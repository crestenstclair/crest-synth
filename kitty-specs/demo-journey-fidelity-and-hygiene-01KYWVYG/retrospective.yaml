- id: h-011
  category: process
  summary: Falsification-by-execution found a proof gap that eleven work-package reviews missed
  evidence_refs:
  - e-021
  details: >-
    During the post-merge review the orchestrator reverted
    src/testing/live_demo_runner.rs:959-964 to unconditional
    AppEvent::from_semantic_action — literally reintroducing DRIFT-6, the defect
    this mission exists to close — and ran cargo test --test effects_and_buses.
    It returned exit 0, 1 passed, 0 failed. The runner was restored from backup
    and re-verified green. No amount of reading the guard source revealed this;
    executing the defect did, in one command. Adopt as standing practice: a
    proof that is claimed to prevent a regression must be tested by performing
    that regression.
- id: h-012
  category: process
  summary: Running the physical demo directly (rather than delegating it) produced the first
    committed live-run evidence in this mission line
  evidence_refs:
  - e-022
  details: >-
    WP11's log was captured and committed at
    kitty-specs/expandable-effects-and-bus-topology-01KYNGX8/evidence/wp11-t044-live-run.log
    (493KB). The parent mission cited two live-run logs (t052-run.log,
    wp10-t059-live-run.log) that are committed in no branch and do not exist on
    this host — its physical claims are unauditable today. Referencing evidence
    is not retaining it; commit the artifact or the claim decays to hearsay.
- id: h-013
  category: process
  summary: Building the merged tree before declaring done caught a break invisible to every
    lane reviewer
  evidence_refs:
